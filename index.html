<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人學習維基百科系統</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #4ade80;
      --danger: #f87171;
      --card-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .search-box {
      margin-top: 0.75rem;
    }
    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      color: var(--text);
      font-size: 0.875rem;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .tree-nav {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0.75rem;
    }
    .category-group {
      margin-bottom: 1rem;
    }
    .category-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.25rem 0.5rem;
      margin-bottom: 0.25rem;
    }
    .nav-item {
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .nav-item:hover { background: var(--surface-hover); }
    .nav-item.active {
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: 600;
      border-left: 3px solid var(--accent);
    }

    /* Main Container */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(8px);
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .tab-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* Article View */
    .article-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .topic-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      background: var(--accent-glow);
      color: var(--accent);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .topic-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .topic-summary {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .section-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }
    .section-body {
      line-height: 1.7;
      font-size: 0.95rem;
      color: #e2e8f0;
    }
    .section-body strong {
      color: #38bdf8;
    }

    /* Table styling */
    .wiki-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    .wiki-table th, .wiki-table td {
      border: 1px solid var(--border);
      padding: 0.65rem 0.85rem;
      text-align: left;
      font-size: 0.9rem;
    }
    .wiki-table th {
      background: rgba(15, 23, 42, 0.7);
      color: var(--text-muted);
      font-weight: 600;
    }
    .wiki-table td:first-child {
      font-weight: 700;
      color: #f1f5f9;
      width: 25%;
      background: rgba(15, 23, 42, 0.3);
    }

    /* Timeline View */
    .timeline {
      position: relative;
      padding-left: 2rem;
      margin-top: 1rem;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background: var(--border);
    }
    .timeline-node {
      position: relative;
      margin-bottom: 1.75rem;
    }
    .timeline-node::before {
      content: "";
      position: absolute;
      left: -2rem;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .timeline-period {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }
    .timeline-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .timeline-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Flashcard View */
    .flashcard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding-top: 1rem;
    }
    .flashcard {
      width: 100%;
      max-width: 550px;
      min-height: 240px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }
    .flashcard:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .flashcard-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .flashcard-text {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.5;
    }
    .flashcard-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .action-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .action-btn:hover { background: var(--surface-hover); border-color: var(--accent); }

    /* Quiz View */
    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .quiz-source-tag {
      display: inline-block;
      font-size: 0.82rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 0.25rem 0.65rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .quiz-q {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .quiz-opts {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .quiz-opt {
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .quiz-opt:hover { background: var(--surface-hover); }
    .quiz-opt.correct {
      background: rgba(74, 222, 128, 0.15);
      border-color: var(--success);
      color: var(--success);
      font-weight: 600;
    }
    .quiz-opt.wrong {
      background: rgba(248, 113, 113, 0.15);
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 600;
    }
    .quiz-explain {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent);
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text);
      display: none;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">
        <span>🧠</span>
        <span>學習維基百科系統</span>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋考點、單元..." />
      </div>
    </div>
    <div class="tree-nav" id="treeNav"></div>
  </aside>

  <!-- Main View -->
  <main id="main">
    <div class="top-bar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="article">📖 條目導讀</button>
        <button class="tab-btn" data-tab="timeline">⏳ 視覺時間軸</button>
        <button class="tab-btn" data-tab="flashcard">🗂️ 記憶抽認卡</button>
        <button class="tab-btn" data-tab="quiz_cap">🎯 會考歷屆真題</button>
        <button class="tab-btn" data-tab="quiz_midterm">🏫 名校段考題（金華）</button>
        <button class="tab-btn" data-tab="quiz_gov">🏛️ 國考／聯考精選題</button>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-muted);">
        模式：動態互動學習
      </div>
    </div>

    <div class="content-area" id="contentArea"></div>
  </main>

  <script src="wiki-data.js"></script>
  <script>
    let currentTopicId = "hist-9-up-1-1";
    let currentTab = "article";
    let currentCardIndex = 0;
    let isFlipped = false;

    function getTopic(id) {
      for (const cat of window.WIKI_DATABASE.categories) {
        for (const t of cat.topics) {
          if (t.id === id) return t;
        }
      }
      return null;
    }

    function renderNav() {
      const navEl = document.getElementById("treeNav");
      navEl.innerHTML = "";
      window.WIKI_DATABASE.categories.forEach(cat => {
        const catGroup = document.createElement("div");
        catGroup.className = "category-group";
        catGroup.innerHTML = `<div class="category-title">${cat.icon} ${cat.name}</div>`;
        
        cat.topics.forEach(t => {
          const item = document.createElement("div");
          item.className = `nav-item ${t.id === currentTopicId ? "active" : ""}`;
          item.innerHTML = `<span>${t.code} ${t.title}</span><span style="font-size:0.7rem; color:var(--text-muted)">${t.badge}</span>`;
          item.onclick = () => {
            currentTopicId = t.id;
            currentCardIndex = 0;
            isFlipped = false;
            renderNav();
            renderContent();
          };
          catGroup.appendChild(item);
        });
        navEl.appendChild(catGroup);
      });
    }

    function renderContent() {
      const container = document.getElementById("contentArea");
      const topic = getTopic(currentTopicId);
      if (!topic) return;

      if (currentTab === "article") {
        let sectionsHtml = "";
        topic.sections.forEach(sec => {
          let body = "";
          if (sec.content) {
            body += `<p>${sec.content}</p>`;
          }
          if (sec.table) {
            body += `<table class="wiki-table"><thead><tr><th>對象</th><th>關鍵考點精髓</th></tr></thead><tbody>`;
            sec.table.forEach(r => {
              body += `<tr><td>${r.entity}</td><td>${r.points}</td></tr>`;
            });
            body += `</tbody></table>`;
          }
          sectionsHtml += `
            <div class="section-card">
              <h2 class="section-title">${sec.title}</h2>
              <div class="section-body">${body}</div>
            </div>
          `;
        });

        container.innerHTML = `
          <div class="article-header">
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.6rem;">
              📁 ${topic.hierarchy ? topic.hierarchy.join(" / ") : ""} &nbsp;•&nbsp; <code>${topic.path || ""}</code>
            </div>
            <span class="topic-badge">${topic.badge}</span>
            <h1 class="topic-title">${topic.code} ${topic.title}</h1>
            <p class="topic-summary">${topic.summary}</p>
          </div>
          ${sectionsHtml}
        `;
      } else if (currentTab === "timeline") {
        let nodesHtml = "";
        topic.timeline.forEach(node => {
          nodesHtml += `
            <div class="timeline-node">
              <div class="timeline-period">${node.period}</div>
              <div class="timeline-title">${node.title}</div>
              <div class="timeline-desc">${node.desc}</div>
            </div>
          `;
        });
        container.innerHTML = `
          <div class="article-header">
            <span class="topic-badge">歷史縱深</span>
            <h1 class="topic-title">${topic.title} · 興衰時間軸</h1>
          </div>
          <div class="timeline">${nodesHtml}</div>
        `;
      } else if (currentTab === "flashcard") {
        const cards = topic.flashcards;
        const card = cards[currentCardIndex];
        container.innerHTML = `
          <div class="article-header" style="text-align: center;">
            <span class="topic-badge">抽認卡記憶訓練 (${currentCardIndex + 1} / ${cards.length})</span>
            <h1 class="topic-title">核心考點快問快答</h1>
          </div>
          <div class="flashcard-container">
            <div class="flashcard" id="cardBox">
              <div class="flashcard-hint" id="cardHint">${isFlipped ? "【答案揭曉】點擊翻回問題" : "【問題】點擊翻看答案"}</div>
              <div class="flashcard-text" id="cardText">${isFlipped ? card.a : card.q}</div>
            </div>
            <div class="flashcard-nav">
              <button class="action-btn" id="prevCard">← 上一張</button>
              <button class="action-btn" id="flipCard">🔄 翻轉卡片</button>
              <button class="action-btn" id="nextCard">下一張 →</button>
            </div>
          </div>
        `;

        const cardBox = document.getElementById("cardBox");
        const toggleFlip = () => {
          isFlipped = !isFlipped;
          document.getElementById("cardHint").textContent = isFlipped ? "【答案揭曉】點擊翻回問題" : "【問題】點擊翻看答案";
          document.getElementById("cardText").textContent = isFlipped ? card.a : card.q;
        };
        cardBox.onclick = toggleFlip;
        document.getElementById("flipCard").onclick = toggleFlip;

        document.getElementById("prevCard").onclick = () => {
          if (currentCardIndex > 0) {
            currentCardIndex--;
            isFlipped = false;
            renderContent();
          }
        };
        document.getElementById("nextCard").onclick = () => {
          if (currentCardIndex < cards.length - 1) {
            currentCardIndex++;
            isFlipped = false;
            renderContent();
          }
        };
      } else if (currentTab === "quiz_cap" || currentTab === "quiz_midterm" || currentTab === "quiz_gov") {
        let questions = [];
        let titleBadge = "";
        let pageTitle = "";

        if (currentTab === "quiz_cap") {
          questions = topic.quiz_cap || [];
          titleBadge = "會考真題實戰";
          pageTitle = "教育部國中會考歷屆真題";
        } else if (currentTab === "quiz_midterm") {
          questions = topic.quiz_midterm || [];
          titleBadge = "名校段考精選（含金華國中）";
          pageTitle = "金華國中與名校精選段考題";
        } else if (currentTab === "quiz_gov") {
          questions = topic.quiz_gov || [];
          titleBadge = "公家考試實戰（警察特考／初等考／大學指考）";
          pageTitle = "國家考試與聯考歷史科精選題目";
        }

        let quizHtml = "";
        questions.forEach((qItem, idx) => {
          let optsHtml = "";
          qItem.options.forEach((opt, oIdx) => {
            optsHtml += `<div class="quiz-opt" data-q="${idx}" data-opt="${oIdx}">${String.fromCharCode(65 + oIdx)}. ${opt}</div>`;
          });
          quizHtml += `
            <div class="quiz-card" id="qcard-${idx}">
              <div class="quiz-source-tag">📌 試題出處：${qItem.source || "名校真題"}</div>
              <div class="quiz-q">${idx + 1}. ${qItem.question}</div>
              <div class="quiz-opts">${optsHtml}</div>
              <div class="quiz-explain" id="qexp-${idx}"><strong>解析：</strong>${qItem.explanation}</div>
            </div>
          `;
        });
        container.innerHTML = `
          <div class="article-header">
            <span class="topic-badge">${titleBadge}</span>
            <h1 class="topic-title">${topic.title} · ${pageTitle}</h1>
          </div>
          ${quizHtml}
        `;

        // Bind quiz answers
        document.querySelectorAll(".quiz-opt").forEach(btn => {
          btn.onclick = function() {
            const qIdx = parseInt(this.getAttribute("data-q"));
            const optIdx = parseInt(this.getAttribute("data-opt"));
            const qItem = questions[qIdx];
            const cardEl = document.getElementById(`qcard-${qIdx}`);
            
            // disable multiple clicks on this question
            const allOpts = cardEl.querySelectorAll(".quiz-opt");
            allOpts.forEach(o => o.style.pointerEvents = "none");

            if (optIdx === qItem.answerIndex) {
              this.classList.add("correct");
            } else {
              this.classList.add("wrong");
              allOpts[qItem.answerIndex].classList.add("correct");
            }
            document.getElementById(`qexp-${qIdx}`).style.display = "block";
          };
        });
      }
    }

    // Tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = function() {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentTab = this.getAttribute("data-tab");
        renderContent();
      };
    });

    // Search filter
    document.getElementById("searchInput").oninput = function(e) {
      const q = e.target.value.toLowerCase().trim();
      const items = document.querySelectorAll(".nav-item");
      items.forEach(it => {
        if (!q || it.textContent.toLowerCase().includes(q)) {
          it.style.display = "flex";
        } else {
          it.style.display = "none";
        }
      });
    };

    // Init
    renderNav();
    renderContent();
  </script>
</body>
</html>
